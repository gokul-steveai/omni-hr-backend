[project]
name = "omni-hr-backend"
version = "0.1.0"
description = "Enterprise OmniHR Backend API with FastAPI and Async SQLAlchemy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.31.0",
    "aiosqlite>=0.22.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=5.0.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.3.0",
    "structlog>=26.1.0",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
